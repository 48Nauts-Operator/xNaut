[[permission]]
identifier = "allow-evidence"
description = "Read the execution chain, verify it, and destroy a session's sealing key."
commands.allow = [
  "evidence_arguments",
  "evidence_sessions",
  "evidence_records",
  "evidence_verify",
  "evidence_shred",
  "evidence_rotate_kek",
  "evidence_kek_label",
  "ticket_evidence",
  "unattributed_sessions",
]

[[permission]]
identifier = "allow-agent-nudge"
description = "Type a wake-up line into an idle agent session."
commands.allow = ["agent_nudge"]

[[permission]]
identifier = "allow-kill-switches"
description = "Read and flip the layer kill-switches (owner surface)."
commands.allow = ["kill_switches_get", "kill_switches_set", "spend_ceiling_get", "spend_ceiling_set", "jury_rereview"]

[[permission]]
identifier = "allow-pm-owner-history"
description = "Read who has held a ticket."
commands.allow = ["pm_ticket_owner_history"]
