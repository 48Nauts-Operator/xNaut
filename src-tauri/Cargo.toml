[package]
name = "xnaut"
version = "1.21.1"
description = "xNAUT - AI-Powered Native Terminal"
authors = ["NautCode Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2.0", features = ["protocol-asset", "devtools", "unstable"] }
tauri-plugin-shell = "2.0"
tauri-plugin-updater = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# PTY (Pseudo-terminal)
portable-pty = "0.8"

# SSH client
# vendored-openssl: statically compile OpenSSL into the binary so the app does
# not depend on Homebrew's libssl.3.dylib at runtime (that dependency crashed
# the app on any Mac without brew openssl, and failed hardened-runtime signing).
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

# HTTP client for AI APIs
reqwest = { version = "0.11", features = ["json", "stream", "blocking"] }
# AES-256-GCM for the sealed blobs. Already in the lock via rustls, so this
# adds a name and no build.
ring = "0.17"
futures-util = "0.3"

# WebSocket for real-time communication (if needed for session sharing)
tokio-tungstenite = "0.21"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async channels
tokio-stream = "0.1"

# Microphone capture for dictation (XNAUT-187). Pure Rust: whisper-rs would
# put a C++ toolchain in the release build, and the Windows leg has already
# died at link time on that class of dependency.
cpal = "0.15"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Base64 encoding
base64 = "0.21"

# Regex for pattern matching (triggers)
regex = "1.10"

# Directory paths
dirs = "5.0"

# Random number generation
getrandom = "0.2"

# Work session logging & proof
sha2 = "0.10"
qrcode = "0.14"
chrono = "0.4"

# Agent registry config (Phase 3 of Orca port)
toml = "0.8"

# Agent hook listener (Phase 5 of Orca port)
axum = { version = "0.7", features = ["ws"] } # ws: mobile bridge (XNAUT-32)
tower = "0.4"
tower-http = { version = "0.5", features = ["limit", "timeout"] }

# Browser panes (Phase 6 of Orca port)
url = "2.5"

# Notes file watching (Phase 8a — hunk port)
notify = "6.1"

# One-time migration of provider credentials from the pre-bundle-id WebKit
# localStorage database into the durable Rust settings registry.
# `bundled` compiles SQLite from source instead of linking the system one.
# Without it the Windows leg of the release dies at link time with
# "LNK1181: cannot open input file 'sqlite3.lib'" — macOS ships libsqlite3 and
# Windows does not, so this only ever fails in CI (v1.16.0 shipped with no
# .exe and no .msi because of it).
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# NOTE: do NOT set panic = "abort" — a panic in any #[tauri::command] would then
# crash the whole app (SIGABRT) instead of being caught and returned as an error.
codegen-units = 16
lto = "thin"
opt-level = "z"
strip = true
