name: CI
on:
  push:
    branches: [development, production]
  pull_request:

jobs:
  ci:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install ruff==0.15.12 pytest==8.4.2 httpx==0.28.1
          python -m pip install -r companions/local-voice/requirements.txt
      - name: Ensure Git LFS for repository transfer tests
        run: |
          if ! git lfs version; then
            if [ "$(id -u)" = 0 ]; then
              apt-get update && apt-get install -y git-lfs
            else
              sudo apt-get update && sudo apt-get install -y git-lfs
            fi
          fi
          git lfs version
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Python tests
        run: |
          python -m pytest -q
          python mcp/test_attest_chain.py
          python mcp/securosys-attest.py --selftest

  incident:
    needs: ci
    if: failure()
    uses: 48Nauts/forgejo-ci-workflow/.forgejo/workflows/_auto-incident.yml@main
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      assignees: jarvis

  ai-review:
    if: github.event_name == 'pull_request'
    uses: 48Nauts/forgejo-ci-workflow/.forgejo/workflows/_ai-review.yml@d14e25b6691267a9d07f0b2093882c35bc324803
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      openai-api-key: ${{ secrets.OPENAI_API_KEY }}
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
    with:
      provider:    ${{ vars.AI_PROVIDER || 'local' }}
      lm-endpoint: ${{ vars.AI_LM_ENDPOINT || 'http://cand0riacstudio:1238' }}
      model:       ${{ vars.AI_MODEL || 'qwen3.8-27b-mlx' }}
      max-tokens:  3000
      request-timeout-seconds: 900
      local-prompt-format: qwen3-non-thinking
      focus:       "bugs, security, async/concurrency mistakes, unclear naming, missing tests"
