name: Published native updater discovery

# Deliberately not called by release assembly: the target must already be public.
on:
  workflow_dispatch:
    inputs:
      old_version:
        description: Published version to launch
        required: true
        default: '1.30.6'
        type: string
      new_version:
        description: Expected latest public version
        required: true
        default: '1.30.7'
        type: string

permissions:
  contents: read

jobs:
  discover:
    name: Native ${{ inputs.old_version }} to ${{ inputs.new_version }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: darwin-aarch64
          - runner: macos-15-intel
            target: darwin-x86_64
          - runner: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check through the old production Tauri updater
        env:
          GH_TOKEN: ${{ github.token }}
          XNAUT_UPDATER_OLD_VERSION: ${{ inputs.old_version }}
          XNAUT_UPDATER_NEW_VERSION: ${{ inputs.new_version }}
        run: python scripts/updater-discovery-smoke.py --target ${{ matrix.target }} --evidence evidence
      - name: Preserve actual discovery and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-discovery-${{ matrix.target }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
