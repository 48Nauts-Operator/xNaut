name: Published native updater discovery

# Deliberately not called by release assembly: the target must already be public.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Native 1.30.2 to 1.30.4 (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: darwin-aarch64
          - runner: macos-15-intel
            target: darwin-x86_64
          - runner: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check through the old production Tauri updater
        run: python scripts/updater-discovery-smoke.py --target ${{ matrix.target }} --evidence evidence
      - name: Preserve actual discovery and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-discovery-${{ matrix.target }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
