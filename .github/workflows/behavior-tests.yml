name: Release behavior contracts

on:
  workflow_call:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: behavior-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          # A package-version bump changes Cargo.lock too. Reuse dependencies,
          # then rebuild and execute all required checks on the new source.
          restore-keys: |
            behavior-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install chromium
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Configure remote Unix shell fixtures on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "XNAUT_TEST_BASH=C:\Program Files\Git\bin\bash.exe" >> $env:GITHUB_ENV
          $pythonPath = python -c "import sys; print(sys.executable)"
          "XNAUT_TEST_PYTHON=$pythonPath" >> $env:GITHUB_ENV
      - name: Verify release behavior on this exact checkout
        run: node scripts/release-behavior.mjs
      - name: Retain test outcomes, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/release-behavior
          if-no-files-found: error
