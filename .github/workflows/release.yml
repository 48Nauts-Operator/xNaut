name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-fire a tag whose run died without touching the tag itself. On 2026-08-26
  # v1.22.1 was pushed into a GitHub Actions outage; the only recovery available
  # was deleting and re-pushing the tag, which turned one stuck run into three
  # dead ones. Pick the tag as the ref and this runs the same pipeline.
  workflow_dispatch:
    inputs:
      update_homebrew_only:
        description: Update Homebrew after the verified draft release is published
        type: boolean
        default: false

jobs:
  build-and-release:
    if: ${{ !inputs.update_homebrew_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Keep the Intel build on an Intel host so Homebrew OpenSSL matches
          # the x86_64 target architecture.
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        # Official prebuilt CLI, pinned to the version used for local release
        # verification. Compiling the tool itself cost 8–18 minutes per runner.
        # Pinning also avoids a new transitive Rust dependency breaking setup.
        run: npm install --global @tauri-apps/cli@2.10.1

      - name: Install Linux dependencies
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install OpenSSL (macOS)
        if: contains(matrix.platform, 'macos')
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      # Import the Developer ID Application cert into a throwaway keychain so
      # `cargo tauri build` can codesign. Skipped automatically if the secret is
      # absent (build stays un-notarized rather than failing).
      - name: Import Apple Developer ID certificate (macOS)
        if: contains(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret set — building un-notarized (Gatekeeper will flag downloads)."
            exit 0
          fi
          KEYCHAIN=build.keychain
          KPW="ci-temp-$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f cert.p12

      # SPLIT BY PLATFORM, and leave Windows alone.
      #
      # This was one shared step, and two releases died trying to make it serve
      # both. v1.13.1 added a bash retry for the macOS DMG; Windows defaults to
      # PowerShell, which cannot parse `build() {`, so the Windows leg failed
      # before compiling. v1.13.2 then forced `shell: bash` on it, which put
      # MSYS/Git-Bash perl ahead of Strawberry Perl on PATH, and openssl-sys
      # shells out to `perl ./Configure` — "Error configuring OpenSSL build".
      #
      # The retry only ever mattered for DMG packaging, which only exists on
      # macOS. Windows gets its original one-liner back, under its own default
      # shell, and nothing about it is clever.
      - name: Build signed release (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Apple Developer ID codesign + notarize (macOS). Tauri notarizes and
          # staples automatically when these are set; harmless/ignored elsewhere.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # --verbose so bundle_dmg.sh's own stderr reaches the log: it fails
          # with "error running bundle_dmg.sh" and no reason otherwise, which
          # cost a whole release cycle to diagnose.
          build() { tauri build --verbose --target ${{ matrix.target }}; }
          if ! build; then
            echo "::warning::bundle failed once — retrying after detaching stale disk images"
            # hdiutil races with diskarbitration on CI runners, and a leftover
            # mount from the first attempt fails the retry for a different reason.
            hdiutil info | awk '/\/dev\/disk/ {print $1}' | xargs -I{} hdiutil detach {} -force 2>/dev/null || true
            rm -rf "target/${{ matrix.target }}/release/bundle/dmg" || true
            sleep 10
            build
          fi

      - name: Build signed release (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Apple Developer ID codesign + notarize (macOS). Tauri notarizes and
          # staples automatically when these are set; harmless/ignored elsewhere.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: tauri build --target ${{ matrix.target }}

      - name: Verify signed microphone permission (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, subprocess
          folder = pathlib.Path('target') / os.environ['RELEASE_TARGET'] / 'release/bundle/macos'
          apps = list(folder.glob('*.app'))
          assert len(apps) == 1, f'Expected one app bundle, found {apps}'
          app = apps[0]
          subprocess.run(['codesign', '--verify', '--deep', '--strict', str(app)], check=True)
          signed = subprocess.run(['codesign', '-d', '--entitlements', ':-', str(app)],
                                  check=True, capture_output=True)
          entitlements = plistlib.loads(signed.stdout)
          assert entitlements.get('com.apple.security.device.audio-input') is True, \
              'Signed app is missing microphone access under Hardened Runtime'
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          assert info.get('NSMicrophoneUsageDescription'), 'Missing microphone consent description'
          print(f'Verified native microphone entitlement and consent description: {app.name}')
          PY

      # Tauri notarizes the .app but NOT the .dmg wrapper, so a downloaded DMG
      # still trips Gatekeeper ("cannot check for malicious software"). Notarize
      # + staple the DMG itself. Uses the same Apple secrets; no-op if unset.
      - name: Notarize + staple the DMG (macOS)
        if: contains(matrix.platform, 'macos')
        working-directory: src-tauri
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          if [ -z "$APPLE_PASSWORD" ]; then
            echo "No APPLE_PASSWORD — skipping DMG notarization."
            exit 0
          fi
          DMG=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then echo "No DMG found — skipping."; exit 0; fi
          echo "Notarizing $DMG"
          # Retry: Apple's notary service is a network call and it flakes. v1.13.10
          # lost its Intel leg to NSURLErrorDomain -1001 (request timed out) and
          # then -1009 (connection appears to be offline) at this exact step. The
          # app had already compiled, signed and notarized Accepted; only the DMG
          # wrapper died, which withheld the Intel DMG, which failed the Homebrew
          # cask job with "no assets match the file pattern" and left brew on the
          # previous version for everyone. One network blip should not cost a
          # release.
          for attempt in 1 2 3; do
            if xcrun notarytool submit "$DMG" \
                 --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
                 --team-id "$APPLE_TEAM_ID" --wait; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "notarytool failed three times — this is not a flake"
              exit 1
            fi
            echo "notarytool attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          # Stapling is also a network call, and it fails the same way.
          for attempt in 1 2 3; do
            if xcrun stapler staple "$DMG"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "stapler failed three times — this is not a flake"
              exit 1
            fi
            echo "stapler attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          spctl -a -vvv -t open --context context:primary-signature "$DMG" || true

      - name: Rename artifacts for clarity
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          TARGET=${{ matrix.target }}
          BUNDLE=target/$TARGET/release/bundle
          if [ "$TARGET" = "aarch64-apple-darwin" ] || [ "$TARGET" = "x86_64-apple-darwin" ]; then
            ARCH=x64
            if [ "$TARGET" = "aarch64-apple-darwin" ]; then ARCH=aarch64; fi
            cp "$BUNDLE"/dmg/*.dmg "target/xNAUT-${VERSION}-macos-${ARCH}.dmg"
            cp "$BUNDLE/macos/xNAUT.app.tar.gz" "target/xNAUT-macos-${ARCH}.app.tar.gz"
            cp "$BUNDLE/macos/xNAUT.app.tar.gz.sig" "target/xNAUT-macos-${ARCH}.app.tar.gz.sig"
          else
            cp "$BUNDLE"/msi/*.msi "target/xNAUT-${VERSION}-windows-x64.msi"
            cp "$BUNDLE"/msi/*.msi.sig "target/xNAUT-${VERSION}-windows-x64.msi.sig"
            cp "$BUNDLE"/nsis/*.exe "target/xNAUT-${VERSION}-windows-x64-setup.exe"
            cp "$BUNDLE"/nsis/*.exe.sig "target/xNAUT-${VERSION}-windows-x64-setup.exe.sig"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Verify the downloaded installers before promoting this draft.
          draft: true
          files: |
            src-tauri/target/xNAUT-*.dmg
            src-tauri/target/xNAUT-*.msi
            src-tauri/target/xNAUT-*-setup.exe
            src-tauri/target/xNAUT-*.app.tar.gz
            src-tauri/target/xNAUT-*.sig
          generate_release_notes: true

  assemble-updater:
    name: Assemble complete updater feed
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all staged updater artifacts and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir updater \
            --pattern '*.app.tar.gz' --pattern '*.msi' --pattern '*-setup.exe' --pattern '*.sig'
      - name: Require every supported target before publishing the feed
        run: python3 scripts/updater-manifest.py updater "${GITHUB_REF_NAME#v}" --repository "$GITHUB_REPOSITORY"
      - name: Attach manifest to the staged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" updater/latest.json --repo "$GITHUB_REPOSITORY" --clobber

  # Keep the Homebrew cask in step with the release. It drifted to 1.9.4 while
  # four versions shipped, so brew users sat on a build without either half of
  # the long-running freeze fix (XNAUT-68). Nobody notices a stale cask, which is
  # exactly why it cannot be a manual step.
  update-homebrew-cask:
    name: Update Homebrew cask
    # `needs` on a matrix job means EVERY leg must pass, so on 2026-08-09 a
    # packaging flake in the Intel DMG silently withheld the Homebrew update
    # from everyone — brew stayed on 1.12.0 while the release itself shipped
    # fine. The cask only ever points at the macOS aarch64 DMG, so gate on that
    # ASSET existing rather than on the health of unrelated platforms.
    needs: build-and-release
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check for tap token and the DMG the cask points at
        id: gate
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_TOKEN is not set — skipping the cask update. The release is unaffected."
            exit 0
          fi
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != "false" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Release is still a draft; Homebrew will update after publication."
            exit 0
          fi
          # This job now runs even when a sibling matrix leg fails, so it must
          # confirm the asset exists rather than trust that the build was green.
          # Publishing a cask that points at a DMG which was never uploaded is
          # worse than not publishing one at all: brew install would 404.
          tag="${GITHUB_REF_NAME}"
          dmg="xNAUT-${tag#v}-macos-aarch64.dmg"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
               -q '.assets[].name' | grep -qx "$dmg"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$dmg is not on the release — skipping the cask update rather than pointing it at a missing file."
          fi

      - name: Checkout tap
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: 48Nauts-Operator/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Rewrite the cask from the published artifacts
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dl
          # Hash what was actually published, never what was built locally.
          for arch in aarch64 x64; do
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --pattern "xNAUT-${VERSION}-macos-${arch}.dmg" --dir dl
          done
          ARM_SHA=$(sha256sum "dl/xNAUT-${VERSION}-macos-aarch64.dmg" | cut -d' ' -f1)
          INTEL_SHA=$(sha256sum "dl/xNAUT-${VERSION}-macos-x64.dmg" | cut -d' ' -f1)
          VERSION="$VERSION" ARM_SHA="$ARM_SHA" INTEL_SHA="$INTEL_SHA" python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("tap/Casks/xnaut.rb")
          s = p.read_text()
          s = re.sub(r'^  version ".*"$', f'  version "{os.environ["VERSION"]}"', s, count=1, flags=re.M)
          # NB: the arm line ends in a comma — anchoring on the closing quote
          # silently matches nothing and ships the previous hash.
          s = re.sub(r'^  sha256 arm:\s+".*",$',
                     f'  sha256 arm:   "{os.environ["ARM_SHA"]}",', s, count=1, flags=re.M)
          s = re.sub(r'^         intel: ".*"$',
                     f'         intel: "{os.environ["INTEL_SHA"]}"', s, count=1, flags=re.M)
          p.write_text(s)
          print(s)
          PY

      - name: Commit and push
        if: steps.gate.outputs.ok == 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "cask already current — nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "xnaut ${GITHUB_REF_NAME#v}"
          git push

  # "The Windows leg compiled" is not "the Windows build works". v1.13.4 shipped
  # with no .exe and v1.16.0 died at link time, and both were only visible by
  # reading CI. The rename step above copies bundles with `|| true`, so an empty
  # Windows bundle still leaves this pipeline green.
  #
  # Same gating shape as the cask job above and for the same reason: `needs` on a
  # matrix waits for every leg, so this runs on always() and decides for itself.
  # Unlike the cask job it FAILS on a missing installer instead of skipping,
  # because here the missing asset IS the bug being hunted.
  windows-install-smoke:
    name: Windows install smoke
    needs: build-and-release
    if: always() && !cancelled() && !inputs.update_homebrew_only
    permissions:
      contents: write # Draft releases require repository push access.
    uses: ./.github/workflows/windows-smoke.yml
    with:
      tag: ${{ github.ref_name }}

  # The website shows live download/release counts fetched from the GitHub API,
  # and falls back to numbers baked into the markup when that fetch fails
  # (unauthenticated, 60/hour per IP — rate limiting is routine). Those fallbacks
  # are only honest if something refreshes them, so this does, once per release.
  # Same failure shape as the stale Homebrew cask: correct when written, quietly
  # wrong later, and nothing notices.
